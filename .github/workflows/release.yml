name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate scripts and regressions
        run: |
          npm run check
          npm test

      - name: Build runtime-only package
        run: npm run package

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/waveform-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
